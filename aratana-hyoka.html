<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>「新たな評価」早わかり</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Old+Mincho:wght@700;900&display=swap">
<style>
:root{
  --paper:#ECEFF3; --surface:#FFFFFF; --ink:#18222D; --ink2:#4C5A69; --line:#C6CED8;
  --ai:#1F4068; --on-ai:#FFFFFF; --ai-tint:#E2E9F2;
  --k:#256B4A; --k-bg:#E1F0E8; --a:#2458A8; --a-bg:#E2EBF9; --g:#9A5416; --g-bg:#F8EAD8; --e:#5B5F6B; --e-bg:#E6E8EC;
  --gold:#B98A14; --red:#A93636; --red-bg:#F7E3E3;
  --mincho:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
  --gothic:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  --tab-h:56px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#131A22; --surface:#1C2530; --ink:#E6EBF0; --ink2:#A5B1BE; --line:#36434F;
    --ai:#9DBFE8; --on-ai:#10202F; --ai-tint:#24364A;
    --k:#74C9A0; --k-bg:#1D3A2D; --a:#8FB5F2; --a-bg:#1E304E; --g:#E6AB6C; --g-bg:#43301B; --e:#B4BAC6; --e-bg:#2C3440;
    --gold:#E3BA4E; --red:#E58B8B; --red-bg:#472424;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#131A22; --surface:#1C2530; --ink:#E6EBF0; --ink2:#A5B1BE; --line:#36434F;
  --ai:#9DBFE8; --on-ai:#10202F; --ai-tint:#24364A;
  --k:#74C9A0; --k-bg:#1D3A2D; --a:#8FB5F2; --a-bg:#1E304E; --g:#E6AB6C; --g-bg:#43301B; --e:#B4BAC6; --e-bg:#2C3440;
  --gold:#E3BA4E; --red:#E58B8B; --red-bg:#472424;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--gothic);font-size:16px;line-height:1.75;-webkit-text-size-adjust:100%}
button,select{font:inherit;color:inherit;cursor:pointer}
a{color:var(--a)}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

.top{padding:20px 0 12px}
.top h1{font-family:var(--mincho);font-weight:900;font-size:clamp(26px,7vw,38px);line-height:1.25;margin:0;letter-spacing:.02em}
.top p{margin:6px 0 0;color:var(--ink2);font-size:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:12px 0 0;padding:0;list-style:none;font-size:12.5px;color:var(--ink2)}
.legend li{display:flex;align-items:center;gap:6px}

.st{display:inline-block;flex:none;font-size:11.5px;font-weight:700;line-height:1;padding:4px 6px 3px;border:1.5px solid currentColor;border-radius:3px;white-space:nowrap;vertical-align:.1em}
.st-k{color:var(--k);background:var(--k-bg)}
.st-a{color:var(--a);background:var(--a-bg)}
.st-g{color:var(--g);background:var(--g-bg)}
.st-e{color:var(--e);background:var(--e-bg)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs ul{display:grid;grid-template-columns:repeat(6,1fr);margin:0 auto;padding:0;list-style:none;max-width:760px}
.tabs button{width:100%;height:var(--tab-h);background:none;border:0;border-top:3px solid transparent;font-size:12px;font-weight:700;color:var(--ink2);padding:0 2px}
.tabs button[aria-selected="true"]{color:var(--ai);border-top-color:var(--ai)}
main{padding-bottom:calc(var(--tab-h) + 40px)}
@media (min-width:800px){
  .tabs{position:sticky;top:env(safe-area-inset-top,0px);bottom:auto;border-top:0;border-bottom:1px solid var(--line);padding-bottom:0}
  .tabs button{font-size:14px;height:48px;border-top:0;border-bottom:3px solid transparent}
  .tabs button[aria-selected="true"]{border-bottom-color:var(--ai)}
  main{padding-bottom:40px}
}

section[hidden]{display:none}
section{padding-top:20px}
h2{font-family:var(--mincho);font-weight:700;font-size:22px;line-height:1.4;margin:0 0 4px}
h3{font-size:16px;margin:0 0 6px;line-height:1.5}
.lead{color:var(--ink2);font-size:14.5px;margin:0 0 16px;max-width:38em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;margin:0 0 14px}
.note{border-left:4px solid var(--g);background:var(--g-bg);padding:10px 12px;font-size:14px;margin:0 0 16px;border-radius:0 4px 4px 0}
.small{font-size:13px;color:var(--ink2)}

.facts{list-style:none;margin:0;padding:0}
.facts li{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.facts li:first-child{border-top:0;padding-top:2px}
.facts .src{grid-column:2}
.src{font-size:12.5px;color:var(--ink2)}
.src a{color:var(--ink2);text-underline-offset:2px}
.term{background:none;border:0;padding:0;border-bottom:1.5px dotted var(--ai);color:inherit;font-weight:inherit;line-height:inherit}

.bldg{display:block;width:100%;max-width:440px;margin:0 auto 6px;height:auto}
.blk{cursor:pointer}
.blk .shape{fill:var(--surface);stroke:var(--ink);stroke-width:1.6}
.blk text{fill:var(--ink);font-family:var(--gothic);pointer-events:none}
.blk .sm{font-size:11px;fill:var(--ink2)}
.blk .lg{font-size:14.5px;font-weight:700}
.blk.on .shape{fill:var(--ai)}
.blk.on text,.blk.on .sm{fill:var(--on-ai)}
.blk:focus-visible .shape{stroke:var(--a);stroke-width:3}
.hint{text-align:center;font-size:13px;color:var(--ink2);margin:0 0 14px}
.plain{margin:6px 0 10px;padding:0;list-style:none;font-size:14.5px}
.plain li{display:grid;grid-template-columns:2.6em 1fr;padding:3px 0}
.plain b{font-family:var(--mincho)}
.levels{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.levels li{display:grid;grid-template-columns:4.6em 1fr;gap:10px;align-items:baseline;font-size:14.5px}
.stars{color:var(--gold);font-size:17px;letter-spacing:.08em;white-space:nowrap}
.zesei{color:var(--red);font-weight:700}

.scroll{overflow-x:auto;margin:0 -4px;padding:0 4px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
th,td{text-align:left;vertical-align:top;padding:8px 10px;border-top:1px solid var(--line)}
thead th{border-top:0;font-size:13px;color:var(--ink2);white-space:nowrap}
tbody th{font-weight:700;white-space:nowrap}
td.neu{background:var(--ai-tint)}

.q{padding:12px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0;padding-top:0}
.q p{margin:0 0 8px;font-size:15px}
.seg{display:inline-grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--ink2);border-radius:4px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:8px 16px;font-size:14px;min-width:6.5em}
.seg button+button{border-left:1.5px solid var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--ai);color:var(--on-ai);font-weight:700}
.cb{display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:start;padding:6px 0;font-size:15px}
.cb input{width:20px;height:20px;margin:4px 0 0;accent-color:var(--ai)}
.result{border:2px solid var(--ink);border-radius:6px;padding:16px;background:var(--surface);margin:0 0 14px}
.result .big{font-family:var(--mincho);font-weight:900;font-size:28px;line-height:1.3;margin:0 0 4px}
.result .big.stars{font-size:38px}
.result p{margin:0 0 6px;font-size:14.5px}
.result.bad{border-color:var(--red);background:var(--red-bg)}
.result.bad .big{color:var(--red)}
.result.wait{border-style:dashed;border-color:var(--line)}
.result.wait .big{font-size:17px;font-family:var(--gothic);color:var(--ink2);margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{background:var(--surface);border:1.5px solid var(--ink2);border-radius:4px;padding:8px 14px;font-size:14px}
.btn.main{background:var(--ai);border-color:var(--ai);color:var(--on-ai);font-weight:700}

.field{display:block;margin:0 0 10px}
.field>span{display:block;font-size:13px;color:var(--ink2);margin:0 0 3px}
input[type=text],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:8px 10px}
textarea{min-height:56px;resize:vertical}
.self{display:inline-grid;grid-template-columns:repeat(3,48px);border:1.5px solid var(--ink2);border-radius:4px;overflow:hidden;margin:0 0 8px}
.self button{background:var(--surface);border:0;height:38px;font-size:17px}
.self button+button{border-left:1.5px solid var(--ink2)}
.self button[aria-pressed="true"]{background:var(--ai);color:var(--on-ai)}
details{border-top:1px solid var(--line)}
details>summary{cursor:pointer;padding:10px 0;font-weight:700;font-size:15px;list-style-position:outside;margin-left:1.1em}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:0 16px;margin:0 0 10px}
.grp>summary{font-family:var(--mincho);font-size:16.5px;padding:14px 0}
.grp .cnt{font-family:var(--gothic);font-weight:400;font-size:13px;color:var(--ink2);margin-left:6px;white-space:nowrap}
.std{font-size:13.5px;color:var(--ink2);margin:10px 0 0;padding:6px 10px;background:var(--paper);border-radius:4px}
.item{padding:12px 0;border-top:1px solid var(--line)}
.item>p{margin:0 0 8px;font-size:15px}
.item details{border:0}
.item details>summary{font-weight:400;font-size:13.5px;color:var(--ink2);padding:2px 0 6px}
.item details ul{margin:0 0 8px;padding-left:1.2em;font-size:13.5px}
.item details h4{margin:4px 0 2px;font-size:12.5px;color:var(--ink2)}
.saved{font-size:13px;color:var(--ink2);min-height:1.6em;margin:6px 0 0}

.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--ink)}
.tl li{position:relative;padding:0 0 18px 16px}
.tl li::before{content:"";position:absolute;left:-21px;top:.55em;width:12px;height:12px;background:var(--paper);border:2px solid var(--ink);border-radius:50%}
.tl li.future::before{border-style:dashed}
.tl time{display:block;font-family:var(--mincho);font-weight:700;font-size:17px;line-height:1.4}
.tl p{margin:2px 0 0;font-size:15px}

.issue h3{font-family:var(--mincho);font-size:18px;margin:0 0 10px}
.duo{display:grid;gap:10px}
@media (min-width:620px){.duo{grid-template-columns:1fr 1fr}}
.duo div{padding:10px 12px;border-radius:4px;font-size:14.5px}
.duo h4{margin:0 0 4px;font-size:13px}
.con{background:var(--g-bg)} .con h4{color:var(--g)}
.pro{background:var(--a-bg)} .pro h4{color:var(--a)}
.issue .src{margin:8px 0 0;display:block}

.prog{font-size:13px;color:var(--ink2);margin:0 0 8px}
.kind{display:inline-block;font-size:12px;color:var(--ink2);border:1px solid var(--line);border-radius:3px;padding:1px 6px;margin:0 0 6px}
.qz-q{font-size:16.5px;font-weight:700;margin:0 0 12px;line-height:1.6}
.opts{display:grid;gap:8px;margin:0 0 12px}
.opts button{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:4px;padding:10px 12px;font-size:15px;line-height:1.5}
.opts button.right{border-color:var(--k);background:var(--k-bg)}
.opts button.wrong{border-color:var(--red);background:var(--red-bg)}
.opts button:disabled{cursor:default;color:var(--ink)}
.fb{font-size:14.5px;margin:0 0 12px}
.fb strong.ok{color:var(--k)} .fb strong.ng{color:var(--red)}
.score{font-family:var(--mincho);font-weight:900;font-size:40px;line-height:1.2;margin:0}

.sheet{position:fixed;left:8px;right:8px;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 8px);z-index:30;background:var(--surface);border:2px solid var(--ai);border-radius:6px;padding:12px 14px;box-shadow:0 6px 24px rgba(10,20,35,.25);max-width:480px;margin:0 auto}
.sheet h3{font-family:var(--mincho);margin:0 2em 4px 0}
.sheet p{margin:0;font-size:14.5px}
.sheet .x{position:absolute;top:6px;right:6px;width:36px;height:36px;background:none;border:0;font-size:20px;line-height:1}
@media (min-width:800px){.sheet{left:auto;right:16px;bottom:16px;width:380px}}

footer{color:var(--ink2);font-size:12.5px;padding:8px 0 24px}
footer details>summary{font-size:13px;font-weight:700}
footer ul{margin:0 0 10px;padding-left:1.2em}
@media (prefers-reduced-motion:no-preference){
  .result,.sheet{animation:pop .18s ease-out}
  @keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>「新たな評価」早わかり</h1>
    <p>認証評価に代わる、学部ごとの4段階評価。図と判定体験で仕組みをつかむ。</p>
    <ul class="legend" aria-label="情報ステータスの凡例">
      <li><span class="st st-k">確定</span>法令・既存の制度</li>
      <li><span class="st st-a">案</span>中教審・文科省が示した案</li>
      <li><span class="st st-g">議論中</span>異論・未整理・二次情報</li>
      <li><span class="st st-e">推計</span>将来の見通し</li>
    </ul>
  </header>
</div>

<nav class="tabs" aria-label="学習メニュー"><ul id="tabs" role="tablist"></ul></nav>

<main class="wrap">
  <section id="v-map" role="tabpanel"></section>
  <section id="v-judge" role="tabpanel" hidden></section>
  <section id="v-check" role="tabpanel" hidden></section>
  <section id="v-timeline" role="tabpanel" hidden></section>
  <section id="v-issues" role="tabpanel" hidden></section>
  <section id="v-quiz" role="tabpanel" hidden></section>

  <footer>
    <p>最終更新日：2026年11月12日（第2版）。内容は2026年11月時点の公開資料に基づく。制度は検討途中のため、最新の文部科学省資料を確認してください。</p>
    <details><summary>更新履歴</summary><ul id="logList"></ul></details>
    <details><summary>出典と確認日</summary><ul id="srcList"></ul></details>
  </footer>
</main>

<div class="sheet" id="sheet" role="dialog" aria-live="polite" hidden>
  <button class="x" id="sheetX" aria-label="用語の説明を閉じる">×</button>
  <h3 id="sheetT"></h3><p id="sheetB"></p>
</div>

<script>
/* ============================================================
   コンテンツデータ：制度の続報が出たら、ここだけ差し替える
   st: k=確定 / a=案 / g=議論中 / e=推計    src: SOURCES のキー
   本文中の [[用語]] は GLOSSARY の説明が開く
   ============================================================ */
var CHECKED = '2026年11月12日';
var CHANGELOG = [
  {d:'2026年11月12日（第2版）',x:'ワーキンググループ「議論のまとめ」の原文を確認し、4段階の定義、機関全体の3基準、質保証の7基準・15項目を原文に合わせた。判定体験を点数のスライダーから、原文の観点を選ぶ形に変更。新旧対比表、15項目のチェック、複数学部の記録と比較、場面問題、間違えた問題の解き直しを追加。'},
  {d:'2026年11月12日（初版）',x:'公開。'}
];
var SOURCES = {
  s3:{t:'文科省 ワーキンググループ「議論のまとめ」（2026年6月3日）',kind:'一次',u:'https://www.mext.go.jp/content/20260602-mxtkoutou02-000050264_2.pdf'},
  s1:{t:'文科省「新たな評価」制度の在り方について（案）（2026年5月）',kind:'一次',u:'https://www.mext.go.jp/content/20260519-mxt-koutou02-000049941_2.pdf'},
  s2:{t:'文科省「新たな評価」の検討状況について（2026年2月）',kind:'一次',u:'https://www.mext.go.jp/content/20260303_mxt_senmon02-000046576_15.pdf'},
  s9:{t:'文科省 質向上・質保証システム部会（第11回）配布資料',kind:'一次',u:'https://www.mext.go.jp/b_menu/shingi/chukyo/chukyo4/055/giji_list/1422801_00026.html'},
  s11:{t:'文科省 認証評価制度の概要',kind:'一次',u:'https://www.mext.go.jp/b_menu/shingi/chukyo/chukyo4/003/gijiroku/04121001/004.htm'},
  s4:{t:'リセマム 制度案の報道（2026年5月22日）',kind:'報道',u:'https://reseed.resemom.jp/article/2026/05/22/13296.html'},
  s5:{t:'リセマム 公立大学協会の意見（2026年10月23日）',kind:'報道',u:'https://reseed.resemom.jp/article/2026/10/23/14423.html'},
  s6:{t:'Between 文科省担当課長インタビュー（2026年7月）',kind:'報道',u:'https://between.shinken-ad.co.jp/detail/2026/07/hyoka1.html'},
  s7:{t:'Between 認証評価制度の改革案・前編（2026年3月）',kind:'報道',u:'https://between.shinken-ad.co.jp/detail/2026/03/hyoka.html'},
  s8:{t:'全私学新聞 第10回部会の報道（2026年7月3日）',kind:'報道',u:'https://www.zenshigaku-np.jp/2026/07/03/1631/'},
  s12:{t:'カレッジマネジメント241号 特集「認証評価 第4期の重要ポイント」',kind:'報道',u:'https://souken.shingakunet.com/publication/college_m/2024_RCM241/2024_RCM241_043.pdf'},
  s10:{t:'co-lect 部会（第9回）議事録の要約',kind:'二次的な要約',u:'https://co-lect.com/%E8%B3%AA%E5%90%91%E4%B8%8A%E3%83%BB%E8%B3%AA%E4%BF%9D%E8%A8%BC%E3%82%B7%E3%82%B9%E3%83%86%E3%83%A0%E9%83%A8%E4%BC%9A%EF%BC%88%E7%AC%AC9%E5%9B%9E%EF%BC%89%E8%AD%B0%E4%BA%8B%E9%8C%B2%E2%94%80%E2%94%80/'}
};

var GLOSSARY = {
  '認証評価':'文部科学大臣の認証を受けた評価機関が、大学を定期的に評価する制度。2004年度に始まった。',
  '内部質保証':'大学が自ら教育の質を点検・評価し、改善を続ける仕組み。認証評価はこれが機能しているかを確かめてきた。',
  'DP':'ディプロマ・ポリシー（卒業認定・学位授与の方針）。卒業までに身に付ける資質・能力を示したもの。',
  'CP':'カリキュラム・ポリシー（教育課程編成・実施の方針）。DPを達成するための教育課程の組み方を示したもの。',
  'AP':'アドミッション・ポリシー（入学者受入れの方針）。入学段階で求める資質・能力と、その評価の考え方を示したもの。',
  'アセスメントプラン':'学修成果を、いつ、何を使って、どう評価するかを定めた計画。',
  '直接評価':'試験、成績、ルーブリック、eポートフォリオなど、学生の知識や能力の表れそのものから学修成果を測る方法。',
  '間接評価':'全国学生調査、振り返りシートなど、学生本人の自己評価を通じて学修成果を捉える方法。',
  '社会での活躍を示すデータ':'就職先への調査、卒業後調査、地域内就職率など、卒業生が社会や地域で貢献していることを示すもの。',

function badge(st){return '<span class="st st-'+st+'">'+ST[st]+'</span>';}
function srcLinks(keys){
  if(!keys||!keys.length) return '';

}

  return '<ul class="facts">'+items.map(function(i){return '<li>'+badge(i.st)+'<span>'+rich(i.x)+'</span>'+srcLinks(i.src)+'</li>';}).join('')+'</ul>';
}
function load(key,fallback){try{var v=localStorage.getItem(key);return v?JSON.parse(v):fallback;}catch(e){return fallback;}}
function save(key,val){try{localStorage.setItem(key,JSON.stringify(val));return true;}catch(e){return false;}}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

function newSim(){return {g:[null,null,null],p:[null,null,null,null],q1:null,c:[false,false,false]};}
var sim=newSim();
function seg(key,val,yes,no){
  return '<div class="seg" role="group"><button type="button" data-k="'+key+'" data-v="1" aria-pressed="'+(val===true)+'">'+yes+'</button><button type="button" data-k="'+key+'" data-v="0" aria-pressed="'+(val===false)+'">'+no+'</button></div>';
}
function renderJudge(){
  var h='<h2>4段階の判定を体験する</h2>'
   +'<p class="note"><strong>判定の流れを理解するための整理です。</strong>議論のまとめの文言に沿っていますが、段階の判定基準は今後調整するとされており、実際の線引きは決まっていません。</p>'
   +'<div class="panel"><h3>一階：機関全体の3基準</h3>'
   +INST.map(function(x,i){return '<div class="q"><p><b>'+(i+1)+'</b>　'+esc(x.t)+'<br><span class="small">'+esc(x.ex)+'</span></p>'+seg('g'+i,sim.g[i],'満たす','満たさない')+'</div>';}).join('')
   +'</div>'
   +'<div class="panel"><h3>二階：質保証の4方針</h3><p class="small" style="margin:0 0 10px">各方針の評価項目を、すべて満たしているかで答えてください。項目は「チェック」の画面にあります。</p>'
   +POLICIES.map(function(p,i){var n=0;p.stds.forEach(function(s){n+=s.items.length;});return '<div class="q"><p><b>'+p.n+'</b>　'+esc(p.t)+'<span class="small">（'+n+'項目）</span></p>'+seg('p'+i,sim.p[i],'満たす','満たさない')+'</div>';}).join('')

function drawSim(){
  var passed=sim.g.every(function(x){return x===true;})&&sim.p.every(function(x){return x===true;});
  var up=$('simUp');
  if(passed){
    var h='<div class="panel"><h3>二階：質向上の視点</h3>'
     +'<div class="q"><p>方針Ⅰ〜Ⅳを踏まえた、学生の成長につながる優れた取組がありますか。</p>'+seg('q1',sim.q1,'ある','ない')
     +'<details style="border:0;margin-top:6px"><summary style="font-weight:400;font-size:13.5px;color:var(--ink2);padding:2px 0">優れた取組の例を見る</summary><ul style="margin:4px 0 0;padding-left:1.2em;font-size:13.5px">'+GOOD_EX.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></details></div>';
    if(sim.q1===true){
      h+='<div class="q"><p>高い教育成果を挙げていると言える観点に、印を付けてください。</p>'
       +TOP_VIEWS.map(function(x,i){return '<label class="cb"><input type="checkbox" data-c="'+i+'"'+(sim.c[i]?' checked':'')+'><span>'+esc(x)+'</span></label>';}).join('')
       +'<p class="small" style="margin-top:6px">'+rich('成果の根拠には、[[直接評価]]の結果、[[間接評価]]の結果、[[社会での活躍を示すデータ]]を使います。')+'</p></div>';
    }
    up.innerHTML=h+'</div>';
  }else{up.innerHTML='';}
  drawResult();
}
function drawResult(){
  var h,rest=sim.g.filter(function(x){return x===null;}).length+sim.p.filter(function(x){return x===null;}).length;
  if(sim.g.some(function(x){return x===false;})){
    h='<div class="result bad"><p class="big">要是正（機関全体）</p><p>'+badge('a')+'　機関全体の基準を十分満たしていないと判断された場合、学部等の評価は行われません。機関として自己改善が求められます。</p></div>';
  }else if(sim.p.some(function(x){return x===false;})){
    var ng=POLICIES.filter(function(p,i){return sim.p[i]===false;}).map(function(p){return p.n;}).join('・');
    h='<div class="result bad"><p class="big">要是正</p><p>'+badge('a')+'　方針'+ng+'で、質保証の基準に達していません。6年を待たずに改善して再受審することが求められ、その間は学部の新設などが認められません。</p></div>';
  }else if(rest>0){
    h='<div class="result wait"><p class="big">残り'+rest+'項目に答えると、次に進みます</p></div>';
  }else if(sim.q1===null){
    h='<div class="result wait"><p class="big">質保証の基準には達しています。優れた取組の有無に答えると、段階が出ます</p></div>';
  }else{
    var n,miss=[];
    if(sim.q1===false) n=1;
    else{TOP_VIEWS.forEach(function(x,i){if(!sim.c[i]) miss.push(x);});n=miss.length?2:3;}
    var def=LEVELS[3-n].t;
    h='<div class="result"><p class="big stars" aria-label="星'+n+'に当たる段階">'+'★★★'.slice(0,n)+'</p><p><strong>'+esc(def)+'</strong></p>';
    if(n===1) h+='<p>求められる水準は満たしています。次の段階には、学生の成長につながる優れた取組が要ります。</p>';
    if(n===2) h+='<p>優れた取組はあり、高い教育成果が期待される段階です。最上位に届いていない観点は次のとおりです。</p><ul style="margin:0 0 6px;padding-left:1.2em;font-size:14.5px">'+miss.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul><p class="small">実際の評価でも、どこが不十分かを評価機関が示すことが望ましいとされています。</p>';
    if(n===3) h+='<p>3つの観点をすべて満たし、高い教育成果を挙げている段階です。</p>';
    h+='<p class="small">'+badge('a')+'　段階の定義は議論のまとめによる。星の数との対応は5月の制度案に基づく。</p></div>';
  }
  $('simResult').innerHTML=h;
}
function bindJudge(){
  var v=$('v-judge');
  v.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b||b.classList.contains('term')) return;
    if(b.id==='simAll'){sim.g=[true,true,true];sim.p=[true,true,true,true];renderJudge();return;}
    if(b.id==='simReset'){sim=newSim();renderJudge();return;}
    var k=b.getAttribute('data-k');if(!k) return;
    var val=b.getAttribute('data-v')==='1';
    if(k==='q1') sim.q1=val; else sim[k.charAt(0)][+k.slice(1)]=val;
    var sib=b.parentNode.querySelectorAll('button');
    for(var i=0;i<sib.length;i++){sib[i].setAttribute('aria-pressed',String(sib[i]===b));}
    drawSim();
  });
  v.addEventListener('change',function(e){
    var c=e.target.getAttribute&&e.target.getAttribute('data-c');
    if(c!==null&&c!==undefined){sim.c[+c]=e.target.checked;drawResult();}
  });
}

var CK='hyoka-check-v2';
function blankDept(name){return {name:name||'',items:{}};}
var chk=(function(){
  var v2=load(CK,null);

  var v1=load('hyoka-check-v1',null);

    d.name=v1.dept||'';
    POLICIES.forEach(function(p,i){var o=v1.items[i]||{};var id=p.stds[0].items[0].id;
      var memo=[o.now,o.evid].filter(function(x){return x;}).join('\n');
      if(memo||o.self) d.items[id]={self:o.self||'',memo:memo};});
  }
  return {cur:0,depts:[d]};
})();
if(!(chk.cur>=0&&chk.cur<chk.depts.length)) chk.cur=0;
var saveTimer=null,clearArmed=false;
function curDept(){return chk.depts[chk.cur];}
function deptLabel(d,i){return d.name||('学部'+(i+1)+'（名称未記入）');}
function tally(d,pi){
  var r={'○':0,'△':0,'×':0,n:0};
  allItems().forEach(function(x){if(pi===undefined||x.pi===pi){r.n++;var s=(d.items[x.it.id]||{}).self;if(s) r[s]++;}});
  return r;
}
function tallyText(t){return '○'+t['○']+'　△'+t['△']+'　×'+t['×']+'　未判定'+(t.n-t['○']-t['△']-t['×']);}
function renderCheck(){
  var d=curDept();
  var h='<h2>自分の学部で確かめる</h2>'
   +'<p class="lead">質保証の15項目を、学部ごとに自己判定します。記入内容はこの端末のブラウザに保存され、他の人には見えません。</p>'
   +'<div class="panel"><label class="field"><span>記録する学部</span><select id="ckSel">'
   +chk.depts.map(function(x,i){return '<option value="'+i+'"'+(i===chk.cur?' selected':'')+'>'+esc(deptLabel(x,i))+'</option>';}).join('')
   +'</select></label><label class="field"><span>この学部の名称</span><input type="text" id="ckName" placeholder="例：経済学部" value="'+esc(d.name)+'"></label>'
   +'<div class="row"><button class="btn" id="ckAdd">学部を追加</button>'+(chk.depts.length>1?'<button class="btn" id="ckDel">この学部の記録を削除</button>':'')+'</div>'
   +'<p class="small" id="ckTally" style="margin:10px 0 0"></p></div>';
  POLICIES.forEach(function(p,pi){
    h+='<details class="grp"'+(pi===0?' open':'')+'><summary>'+p.n+'　'+esc(p.t)+'<span class="cnt" id="cnt'+pi+'"></span></summary>';
    p.stds.forEach(function(s,si){
      h+='<p class="std">評価基準'+'①②'.charAt(si)+'　'+esc(s.t)+'</p>';
      s.items.forEach(function(it,ii){var o=d.items[it.id]||{};
        h+='<div class="item"><p><b>'+'abcde'.charAt(ii)+'</b>　'+esc(it.t)+'</p>'
         +'<div class="self" role="group" aria-label="自己判定">'
         +['○','△','×'].map(function(m){return '<button type="button" data-id="'+it.id+'" data-m="'+m+'" aria-pressed="'+(o.self===m)+'" aria-label="'+({'○':'できている','△':'一部できている','×':'できていない'})[m]+'">'+m+'</button>';}).join('')
         +'</div><details><summary>根拠資料の例と、基準を満たさない判断例</summary><h4>根拠資料の例</h4><ul>'+it.ev.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul><h4>基準を満たさないと判断される例</h4><ul>'+it.ng.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></details>'
         +'<textarea data-id="'+it.id+'" placeholder="現状と根拠資料のメモ" aria-label="現状と根拠資料のメモ">'+esc(o.memo||'')+'</textarea></div>';
      });
    });
    h+='</details>';
  });
  h+='<p class="small">'+badge('a')+'　項目、根拠資料の例、判断例は、議論のまとめの別添（4年制大学の学部を想定したモデル）を要約したもの。判断例は一部を抜粋。'+srcLinks(['s3'])+'</p>'
   +'<div id="ckCompare"></div>'
   +'<div class="row"><button class="btn main" id="ckCopy">この学部の記入内容をテキストでコピー</button><button class="btn" id="ckClear">この学部の記入内容を消す</button></div>'

  $('v-check').innerHTML=h;

function drawTally(){
  var d=curDept();
  $('ckTally').textContent='15項目の自己判定：'+tallyText(tally(d));
  POLICIES.forEach(function(p,pi){var t=tally(d,pi);$('cnt'+pi).textContent=(t['○']+t['△']+t['×'])+' / '+t.n+' 項目を判定';});

   +'</tbody></table></div><p class="small" style="margin:8px 0 0">×が1つでもある方針は、質保証の視点で基準に達しないおそれがあります。</p></div>';
}
function queueSave(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){var m=$('ckMsg');if(m) m.textContent=save(CK,chk)?'保存しました。':'この環境では保存できません。コピーして控えてください。';},500);
}
function checkText(){
  var d=curDept();
  var t='「新たな評価」質保証15項目の自己判定\n対象の学部：'+(d.name||'（未記入）')+'\n集計：'+tallyText(tally(d))+'\n';
  POLICIES.forEach(function(p){
    t+='\n【方針'+p.n+'】'+p.t+'\n';
    p.stds.forEach(function(s,si){s.items.forEach(function(it,ii){var o=d.items[it.id]||{};
      t+='　'+'①②'.charAt(si)+'abcde'.charAt(ii)+'　['+(o.self||'未')+']　'+it.t+'\n'+(o.memo?'　　メモ：'+o.memo.replace(/\n/g,'\n　　')+'\n':'');});});
  });
  return t;
}
function copyCheck(){
  var t=checkText(),msg=$('ckMsg'),out=$('ckOut');
  function fallback(){out.hidden=false;out.value=t;out.focus();out.select();var ok=false;try{ok=document.execCommand('copy');}catch(e){}
    msg.textContent=ok?'コピーしました。':'下の欄を選択してコピーしてください。';}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){msg.textContent='コピーしました。';},fallback);}
  else fallback();
}
function bindCheck(){
  var v=$('v-check');
  v.addEventListener('input',function(e){
    var t=e.target,d=curDept();
    if(t.id==='ckName'){d.name=t.value;var op=$('ckSel').options[chk.cur];if(op) op.textContent=deptLabel(d,chk.cur);drawTally();}
    else if(t.tagName==='TEXTAREA'&&t.dataset.id){(d.items[t.dataset.id]=d.items[t.dataset.id]||{}).memo=t.value;}
    else return;
    queueSave();
  });
  v.addEventListener('change',function(e){
    if(e.target.id==='ckSel'){chk.cur=+e.target.value;save(CK,chk);renderCheck();}
  });
  v.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b) return;
    var d=curDept();
    if(b.dataset.m){
      var o=d.items[b.dataset.id]=d.items[b.dataset.id]||{};
      o.self=(o.self===b.dataset.m)?'':b.dataset.m;
      var sib=b.parentNode.querySelectorAll('button');
      for(var j=0;j<sib.length;j++){sib[j].setAttribute('aria-pressed',String(sib[j].dataset.m===o.self));}
      drawTally();queueSave();
    }else if(b.id==='ckAdd'){chk.depts.push(blankDept(''));chk.cur=chk.depts.length-1;save(CK,chk);renderCheck();$('ckName').focus();}
    else if(b.id==='ckCopy'){copyCheck();}
    else if(b.id==='ckClear'||b.id==='ckDel'){
      if(!clearArmed||clearArmed!==b.id){clearArmed=b.id;var old=b.textContent;b.textContent='もう一度押すと実行します';setTimeout(function(){clearArmed=false;if($(b.id)) $(b.id).textContent=old;},4000);}
      else{clearArmed=false;
        if(b.id==='ckDel'){chk.depts.splice(chk.cur,1);chk.cur=0;}else{d.items={};}
        save(CK,chk);renderCheck();$('ckMsg').textContent=(b.id==='ckDel')?'学部の記録を削除しました。':'記入内容を消しました。';}
    }
  });
}

/* ============================================================
   6. クイズ（毎回10問を選び、並べ替えて出題。間違えた問題は解き直せる）
   ============================================================ */
var QK='hyoka-quiz-v2';
var qz={set:[],i:0,score:0,wrong:[],answered:false,full:true,best:load(QK,{best:null}).best};
function pickRound(){
  var k=shuffle(QUIZ.filter(function(q){return q.kind==='k';})).slice(0,QUIZ_ROUND.k);
  var s=shuffle(QUIZ.filter(function(q){return q.kind==='s';})).slice(0,QUIZ_ROUND.s);
  return shuffle(k.concat(s));
}
function startQuiz(set,full){qz.set=set;qz.i=0;qz.score=0;qz.wrong=[];qz.answered=false;qz.full=full;renderQuiz();}
function renderQuiz(){
  var v=$('v-quiz'),total=qz.set.length;
  if(qz.i>=total){
    var newBest=false;
    if(qz.full&&(qz.best===null||qz.score>qz.best)){qz.best=qz.score;save(QK,{best:qz.best});newBest=true;}
    var msg=qz.score===total?'全問正解です。':(qz.score>=total*0.7?'骨格は押さえられています。間違えた問題を解き直すと定着します。':'「全体像」と「チェック」を見直してから、もう一度解いてみてください。');
    v.innerHTML='<h2>確認クイズ</h2><div class="panel"><p class="score">'+qz.score+' / '+total+' 問正解</p><p>'+msg+'</p>'
     +(qz.best!==null?'<p class="small">10問での最高は'+qz.best+'問'+(newBest?'（今回更新）':'')+'</p>':'')
     +'<div class="row" style="margin-top:12px">'+(qz.wrong.length?'<button class="btn main" id="qzRetry">間違えた'+qz.wrong.length+'問を解き直す</button>':'')
     +'<button class="btn'+(qz.wrong.length?'':' main')+'" id="qzAgain">新しい10問を解く</button></div></div>';
    if(qz.wrong.length) $('qzRetry').addEventListener('click',function(){startQuiz(shuffle(qz.wrong),false);});
    $('qzAgain').addEventListener('click',function(){startQuiz(pickRound(),true);});
    return;
  }
  var q=qz.set[qz.i],order=shuffle([0,1,2,3]);
  v.innerHTML='<h2>確認クイズ</h2><p class="prog">'+(qz.i+1)+'問目 / 全'+total+'問'+(qz.full?'':'（解き直し）')+(qz.best!==null?'　10問での最高は'+qz.best+'問':'')+'</p>'
   +'<div class="panel"><span class="kind">'+(q.kind==='s'?'場面で考える':'知識を確かめる')+'</span><p class="qz-q">'+esc(q.q)+'</p><div class="opts">'
   +order.map(function(oi){return '<button type="button" data-o="'+oi+'">'+esc(q.o[oi])+'</button>';}).join('')
   +'</div><div id="qzFb" aria-live="polite"></div></div>';
  var bs=v.querySelectorAll('.opts button');
  for(var i=0;i<bs.length;i++){bs[i].addEventListener('click',function(){
    if(qz.answered) return;qz.answered=true;
    var pick=+this.getAttribute('data-o'),ok=pick===0;if(ok) qz.score++; else qz.wrong.push(q);
    for(var j=0;j<bs.length;j++){var oj=+bs[j].getAttribute('data-o');bs[j].disabled=true;if(oj===0) bs[j].classList.add('right');else if(oj===pick) bs[j].classList.add('wrong');}
    $('qzFb').innerHTML='<p class="fb"><strong class="'+(ok?'ok':'ng')+'">'+(ok?'正解です。':'不正解です。')+'</strong>'+esc(q.e)+'<br>'+badge(q.st)+'　'+srcLinks([q.src])+'</p>'
     +'<button class="btn main" id="qzNext">'+(qz.i+1<total?'次の問題へ':'結果を見る')+'</button>';
    $('qzNext').addEventListener('click',function(){qz.i++;qz.answered=false;renderQuiz();});
    $('qzNext').focus();
  });}
}

/* ============================================================
   タブ切り替え（ハッシュで各画面に直接リンクできる）
   ============================================================ */
function show(id){
  if(!TABS.some(function(t){return t.id===id;})) id='map';
  TABS.forEach(function(t){
    $('v-'+t.id).hidden=(t.id!==id);
    $('t-'+t.id).setAttribute('aria-selected',String(t.id===id));
  });
  $('sheet').hidden=true;
  try{window.scrollTo(0,0);}catch(e){}
}
function init(){
  $('tabs').innerHTML=TABS.map(function(t){return '<li role="presentation"><button type="button" role="tab" id="t-'+t.id+'" aria-controls="v-'+t.id+'" aria-selected="false">'+t.label+'</button></li>';}).join('');
  TABS.forEach(function(t){$('t-'+t.id).addEventListener('click',function(){
    try{location.hash=t.id;}catch(e){}
    show(t.id);
  });});
  $('logList').innerHTML=CHANGELOG.map(function(c){return '<li><strong>'+esc(c.d)+'</strong>　'+esc(c.x)+'</li>';}).join('');
  $('srcList').innerHTML=Object.keys(SOURCES).map(function(k){var s=SOURCES[k];return '<li>['+esc(s.kind)+'] <a href="'+s.u+'" target="_blank" rel="noopener">'+esc(s.t)+'</a>　確認日：'+CHECKED+'</li>';}).join('');
  renderMap();bindJudge();renderJudge();bindCheck();renderCheck();renderTimeline();renderIssues();startQuiz(pickRound(),true);
  window.addEventListener('hashchange',function(){show(location.hash.replace('#',''));});
  show(location.hash.replace('#',''));
}
init();
</script>
